# Dashboard servi en conteneur (apps/dashboard/Dockerfile).
server {
  listen 80;
  root /usr/share/nginx/html;
  # Redirections relatives : le port publié (7000) n'est pas celui du conteneur (80).
  absolute_redirect off;

  # Fichiers fingerprintés par Vite : cache permanent.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Routage côté client (TanStack Router) : toute autre adresse renvoie l'application.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
