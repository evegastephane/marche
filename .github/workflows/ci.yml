# Intégration continue (docs/PLAN-CODE.md §9.1) : sur chaque PR et sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # prisma generate charge prisma.config.ts, qui exige DATABASE_URL : valeur factice, aucune connexion.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  quality:
    name: Lint, types, tests unitaires, frontières, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Node 26 embarque npm 11 : on aligne sur le packageManager (npm 12 applique allowScripts).
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npx turbo run build lint typecheck test
      - run: npm run depcruise
      - run: npm audit --audit-level=high

  e2e:
    name: Tests e2e (PostgreSQL et Redis via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npx turbo run test:e2e --filter=@marche/api

  docker:
    name: Image Docker de l'API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image API et worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image de migration
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha
